<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>网上书城-注册新用户</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 50px;
            background-color: #fff;
        }

        .register-box {
            width: 480px;
            margin: 0 auto;
            border: 1px solid #999;
            background-color: #e0e0e0;
        }


        .title-bar {
            background-color: #666;
            color: #fff;
            text-align: center;
            padding: 8px;
            font-size: 18px;
            letter-spacing: 4px;
        }


        .sub-title {
            padding: 6px 15px;
            background: #ddd;
            border-bottom: 1px solid #aaa;
            font-size: 14px;
        }


        .form-area {
            padding: 20px 40px;
            border: 3px solid #fff;
            margin: 10px;
        }

        form table {
            margin: 0 auto;
            border-collapse: separate;
            border-spacing: 0 12px;
        }


        input {
            width: 320px;
            height: 24px;
            padding: 3px 8px 3px 30px;
            border: 1px solid #888;
            font-size: 12px;
            background-repeat: no-repeat;
            background-position: 6px center;
            background-size: 16px 16px;
        }


        .input-user {
            background-image: url('https://cdn-icons-png.flaticon.com/16/1077/1077063.png');
        }
        .input-pwd {
            background-image: url('https://cdn-icons-png.flaticon.com/16/3064/3064155.png');
        }
        .input-repwd {
            background-image: url('https://cdn-icons-png.flaticon.com/16/1160/1160654.png');
        }
        .input-email {
            background-image: url('https://cdn-icons-png.flaticon.com/16/732/732200.png');
        }


        .submit-btn {
            width: 320px;
            height: 26px;
            background-color: #444;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="register-box">
        <div class="title-bar">网上书城</div>
        <div class="sub-title">✚ 注册新用户</div>
        <div class="form-area">
            <form action="#" method="post">
                <table>
                    <tr>
                        <td>
                            <input type="text" class="input-user" placeholder="用户名" required>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="password" class="input-pwd" placeholder="密码" required>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="password" class="input-repwd" placeholder="确认密码" required>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="email" class="input-email" placeholder="电子邮件" required>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <button type="submit" class="submit-btn">注册新用户</button>
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
</body>
</html>
