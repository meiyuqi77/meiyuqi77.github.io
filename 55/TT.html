<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>焦点轮播图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .banner {
            display: flex;
            align-items: center;
            width: 1000px;
            margin: 50px auto;
            position: relative;
        }
        .arrow {
            border: none;
            background: transparent;
            cursor: pointer;
            z-index: 10;
        }
        .arrow img {
            width: 55px;
        }
        .arrow-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            position: absolute;
            z-index: 99;
            background: rgba(255,255,0.6);
        }
        .arrow{
            width: 60px;
            height: 60px;
            background: rgba(64, 166, 176, 0.7);
            border: none;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
      }
        .banner-box {
            flex: 1;
        }
        .banner-box img {
            width: 100%;
            display: block;
        }
        .prev { left: 10px; }
        .next { right: 10px; }
        .point-list {
            display: flex;
            gap: 10px;
            list-style: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }
        .point-list img {
            width: 18px;
        }
    </style>
</head>
<body>
    <div class="banner">
        <button class="arrow prev">
            <img src="images/arrow1.png" alt="左切换">
        </button>
        <div class="banner-box">
            <img src="images/banner1.jpg" alt="地球日海报">
        </div>
        <button class="arrow next">
            <img src="images/arrow2.png" alt="右切换">
        </button>
        <ul class="point-list">
            <li><img src="images/point1.png" alt="圆点"></li>
            <li class="active"><img src="images/point2.png" alt="选中圆点"></li>
            <li><img src="images/point1.png" alt="圆点"></li>
            <li><img src="images/point1.png" alt="圆点"></li>
        </ul>
    </div>
</body>
</html>
