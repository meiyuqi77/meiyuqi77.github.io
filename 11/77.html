<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如何培养认真严谨的习惯</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft Yahei", sans-serif;
            max-width: 800px;
            margin: 30px; auto;
            padding: 0;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px 0;
        }
        h1 span{
            color:#0066cc;
        }

        .meta-info {
            text-align: center;
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .left-img {
            flex: 1;
        }
        .left-img img {
            width: 100%;
            display: block;
        }
        .right-content {
            flex: 2;
            font-size: 1.3rem;
            line-height: 2.2;

        }
        。right-content p {
            margin: 15px 0;
        }
        .right-content .red-text {
            color: #cc0000;
            font-weight: bold;
        }
        .image {
            text-align: center;
            font-size: 20px 0;
        }

        .image {
            max-width: 100%;
            height: auto;
        }

        .content-list {
            font-size: 12px;
            line-height: 1.6;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>如何培养<span>认真严谨</span>的习惯</h1>
    <div class="meta-info">
        时间：2022年02月11日 17点26分 来源： 思政教育
    </div>
    <div class="container">
        <div class="left-img">
            <image src="image/作业样图.jpg" alt="态度决定一切 细节决定成败"
    </div>
    <div class="right-content">
            <p>◆ <span class="red-text">反复确认</span>，做任何事情都要照顾到每一个细节并反复确认，<span class="red-text">要有一种能在脑子里‘虚拟’整个事件过程的能力</span>，确保所有的节点都正常。</p >
            <p>◆ <span class="red-text">想尽办法努力让不可能变为可能</span>只有佣金全力做了，才算是努力</p >
            <p>◆ <span class="red-text">结果导向一切以结果为导向</span>，任何事情都是你的名片。还要思考你的结果和过程是否满足所有和你配合的人的需求,</p >
            <p>◆ <span class="red-text">学会假设了解周围比你强的人</span>，观察他们的做事方法。遇到让自己束手无策的时候，把自己虚拟成他的样子，想想他会怎么做</p >
        </div>
    </div>
        

    </div>
