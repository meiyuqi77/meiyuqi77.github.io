<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trae Work</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0a0a0a;
      background-image: radial-gradient(#222 1px, transparent 1px);
      background-size: 20px 20px;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }


    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background-color: #000;
      border-bottom: 1px solid #222;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .logo {
      color: #fff;
      font-weight: bold;
      font-size: 18px;
    }
    .nav-links {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: #aaa;
    }
    .nav-links span:hover {
      color: #fff;
      cursor: pointer;
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .download-btn {
      background-color: #222;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .login-btn {
      background-color: #39d353;
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }


    .header-section {
      margin-bottom: 32px;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .new-tag {
      color: #39d353;
      font-size: 14px;
    }
    .beta-tag {
      color: #39d353;
      font-size: 12px;
      border: 1px solid #39d353;
      border-radius: 4px;
      padding: 2px 6px;
    }
    .main-title {
      font-size: 36px;
      font-weight: bold;
      background: linear-gradient(90deg, #fff, #aaa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }


    .input-section {
      background-color: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 40px;
    }
    .prompt-input {
      width: 100%;
      background-color: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      min-height: 80px;
      resize: none;
      outline: none;
    }
    .prompt-input::placeholder {
      color: #666;
    }


    .button-bar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid #333;
    }
    .left-tools {
      display:flex;
      gap:18px;
    }
    .right-tools {
      display:flex;
      align-items:center;
      gap:16px;
    }
    .tool-btn {
      background:transparent;
      border:none;
      color:#888;
      font-size:18px;
      cursor:pointer;
    }

    .send-btn {
      width:32px;
      height:32px;
      border-radius:4px;
      background-color:#39d353;
      color:#000;
      border:none;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }


    .card-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-bottom: 40px;
    }
    .card-item {
      background-color: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
      width: calc(50% - 8px);
      text-align: left;
      font-size: 14px;
      color: #aaa;
    }


    .footer-gradient {
      height: 80px;
      background: linear-gradient(to top, rgba(57,211,83,0.2), transparent);
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <div class="logo">TRAE</div>
      <div class="nav-links">
        <span>产品 ▾</span>
        <span>企业版</span>
        <span>定价</span>
        <span>文档</span>
        <span>更新日志</span>
        <span>社区</span>
        <span>知识库</span>
      </div>
    </div>
    <div class="nav-right">
      <button class="download-btn">下载中心</button>
      <button class="login-btn">登录</button>
    </div>
  </nav>

  <div class="container">

    <div class="header-section">
      <div class="header-top">
        <span class="new-tag">全新 TRAE Work</span>
        <span class="beta-tag">BETA</span>
      </div>
      <h1 class="main-title">不止于码 大有可为</h1>
    </div>


    <div class="input-section">
      <textarea class="prompt-input" placeholder="描述你想做的事，剩下的交给 TRAE Work"></textarea>
      <div class="button-bar">

        <div class="left-tools">
          <button class="tool-btn">@</button>
          <button class="tool-btn">🖼️</button>
          <button class="tool-btn">📎</button>
        </div>

        <div class="right-tools">
          <button class="tool-btn">🎤</button>
          <button class="send-btn">↑</button>
        </div>
      </div>
    </div>


    <div class="card-grid">
      <div class="card-item">📄 研读书文，产出论文回答</div>
      <div class="card-item">📊 调研各个招投标平台,生成汇报PPT</div>
      <div class="card-item">📈 挖掘AI市场的数据,分析数据趋势</div>
      <div class="card-item">💻 开发一个多语言学习网站</div>
      <div class="card-item">📚 分析这个项目仓库,生成code wiki</div>
      <div class="card-item">🎮 创作一个像素机甲对战游戏</div>
    </div>
  </div>


  <div class="footer-gradient"></div>
</body>
</html>
